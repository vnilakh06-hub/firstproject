<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Pediatric Health Tracker</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }
    body {
      background: #f0f8ff;
      min-height: 100vh;
      transition: 0.4s;
    }
    nav {
      background-color: #3498db;
      padding: 15px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: white;
    }
    nav .logo {
      font-size: 20px;
      font-weight: bold;
    }
    nav .nav-links {
      display: flex;
      gap: 20px;
    }
    nav .nav-links a {
      color: white;
      text-decoration: none;
      font-weight: 500;
    }
    nav .nav-links a:hover {
      text-decoration: underline;
    }
    .page {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }
    .container {
      background: #ffffff;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0px 8px 16px rgba(0,0,0,0.2);
      width: 90%;
      max-width: 400px;
      text-align: center;
    }
    h1, h2 {
      margin-bottom: 20px;
      color: #3498db;
    }
    input, select, textarea {
      width: 100%;
      padding: 10px;
      margin: 10px 0;
      border-radius: 5px;
      border: 1px solid #ccc;
    }
    button {
      width: 100%;
      padding: 10px;
      margin-top: 15px;
      background-color: #3498db;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    button:hover {
      background-color: #2980b9;
    }
    .hidden {
      display: none;
    }
    #dashboard, #chart-page {
      width: 90%;
      max-width: 700px;
      background: white;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0px 8px 16px rgba(0,0,0,0.2);
    }
    #milestone-box {
      margin-top: 20px;
      background: #e8f6f3;
      padding: 20px;
      border-radius: 10px;
      text-align: left;
    }
    canvas {
      margin-top: 20px;
    }
    ul {
      text-align: left;
      margin-top: 10px;
    }
  </style>
</head>

<body>

<!-- Navbar -->
<nav>
  <div class="logo">Pediatric Health Tracker</div>
  <div class="nav-links">
    <a href="#" onclick="showPage('login-page')">Login</a>
    <a href="#" onclick="showPage('child-details-page')">Child Details</a>
    <a href="#" onclick="showPage('dashboard')">Dashboard</a>
    <a href="#" onclick="showPage('chart-page')">Growth Chart</a>
  </div>
</nav>

<!-- Pages -->

<div class="page" id="login-page">
  <div class="container">
    <h1>Login / Signup</h1>
    <form id="login-form">
      <input type="text" id="username" placeholder="Username" required>
      <input type="password" id="password" placeholder="Password" required>
      <button type="submit">Continue</button>
    </form>
  </div>
</div>

<div class="page hidden" id="child-details-page">
  <div class="container">
    <h1>Child's Details</h1>
    <form id="child-form">
      <input type="text" id="child-name" placeholder="Child's Name" required>
      <input type="number" id="age" placeholder="Age (years)" required>
      <input type="number" id="height" placeholder="Height (cm)" required>
      <input type="number" id="weight" placeholder="Weight (kg)" required>
      <select id="gender" required>
        <option value="">Select Gender</option>
        <option value="Male">Male</option>
        <option value="Female">Female</option>
      </select>
      <input type="number" id="bmi" placeholder="BMI" readonly>
      <button type="button" onclick="calculateBMI()">Calculate BMI</button>
      <button type="submit">Next</button>
    </form>
  </div>
</div>

<div class="page hidden" id="dashboard">
  <div class="container">
    <h1>Dashboard</h1>
    <div id="child-info"></div>

    <h2>Upcoming Immunizations</h2>
    <ul>
      <li>MMR Vaccine - Age 12 months</li>
      <li>Hepatitis A Vaccine - Age 1 year</li>
      <li>DTaP Booster - Age 4-6 years</li>
      <li>Polio Booster - Age 4-6 years</li>
    </ul>

    <button onclick="goToChartPage()">View Growth Chart ➔</button>
  </div>
</div>

<div class="page hidden" id="chart-page">
  <div class="container">
    <h1>Growth Chart</h1>
    <canvas id="growthChart" width="400" height="250"></canvas>

    <div id="milestone-box">
      <h2>Milestone</h2>
      <textarea id="milestone-input" placeholder="Enter child's recent milestone..." rows="4"></textarea>
      <button onclick="saveMilestone()">Save Milestone</button>
      <div id="saved-milestone" style="margin-top:10px;"></div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
  const loginForm = document.getElementById('login-form');
  const childForm = document.getElementById('child-form');
  const pages = document.querySelectorAll('.page');

  // Function to hide/show pages
  function showPage(pageId) {
    pages.forEach(page => {
      if (page.id === pageId) {
        page.classList.remove('hidden');
      } else {
        page.classList.add('hidden');
      }
    });
  }

  // Login Form
  loginForm.addEventListener('submit', function(event) {
    event.preventDefault();
    showPage('child-details-page');
  });

  // Calculate BMI
  function calculateBMI() {
    const height = document.getElementById('height').value;
    const weight = document.getElementById('weight').value;
    const bmiField = document.getElementById('bmi');

    if (height > 0 && weight > 0) {
      let bmi = (weight / ((height/100) ** 2)).toFixed(2);
      bmiField.value = bmi;
    } else {
      bmiField.value = '';
      alert('Please enter valid height and weight.');
    }
  }

  // Child Details Submit
  childForm.addEventListener('submit', function(event) {
    event.preventDefault();
    showPage('dashboard');
    showChildData();
  });

  // Show Child Data in Dashboard
  function showChildData() {
    const name = document.getElementById('child-name').value;
    const age = document.getElementById('age').value;
    const height = document.getElementById('height').value;
    const weight = document.getElementById('weight').value;
    const bmi = document.getElementById('bmi').value;
    const gender = document.getElementById('gender').value;

    document.getElementById('child-info').innerHTML = `
      <p><strong>Name:</strong> ${name}</p>
      <p><strong>Age:</strong> ${age} years</p>
      <p><strong>Gender:</strong> ${gender}</p>
      <p><strong>Height:</strong> ${height} cm</p>
      <p><strong>Weight:</strong> ${weight} kg</p>
      <p><strong>BMI:</strong> ${bmi}</p>
    `;
  }

  // Go to Chart Page
  function goToChartPage() {
    showPage('chart-page');
    createGrowthChart();
  }

  // Create Growth Chart
  function createGrowthChart() {
    const ctx = document.getElementById('growthChart').getContext('2d');
    new Chart(ctx, {
      type: 'line',
      data: {
        labels: ['Birth', '6 Months', '1 Year', '2 Years', '3 Years', 'Now'],
        datasets: [{
          label: 'Height (cm)',
          data: [50, 68, 76, 85, 95, parseInt(document.getElementById('height').value)],
          borderColor: 'rgba(52,152,219,1)',
          backgroundColor: 'rgba(52,152,219,0.2)',
          fill: true,
          tension: 0.4
        }]
      },
      options: {
        responsive: true,
        scales: {
          y: {
            beginAtZero: true
          }
        }
      }
    });
  }

  // Save Milestone
  function saveMilestone() {
    const milestone = document.getElementById('milestone-input').value;
    if (milestone.trim() !== '') {
      document.getElementById('saved-milestone').innerHTML = `<strong>Saved Milestone:</strong> ${milestone}`;
      document.getElementById('milestone-input').value = '';
    }
  }
</script>

</body>
</html>
